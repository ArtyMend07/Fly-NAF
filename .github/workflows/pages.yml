name: pages

on:
  push:
    branches: [main]
    paths:
      - examples/night-3-page/**
      - src/flynaf/env/brain_view.html
      - src/flynaf/env/replay_player.js
      - src/flynaf/replay_page.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m flynaf.replay_page build _site
        env:
          PYTHONPATH: src
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

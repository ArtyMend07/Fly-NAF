[project]
name = "fly-naf"
version = "0.1.0"
description = "A whole-brain Drosophila connectome simulation that plays Five Nights at Freddy's 1"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "caveclient>=5.21.0",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pytz>=2026.3.post1",
    "pyvista>=0.49.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flynaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "connectome: runs the real engine on the FlyWire data, skipped when the data is not in place",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["flynaf"]

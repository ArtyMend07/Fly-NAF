[project]
name = "fly-naf"
version = "0.1.0"
description = "A whole-brain Drosophila connectome simulation that plays Five Nights at Freddy's 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "caveclient>=5.21.0",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytz>=2026.3.post1",
    "pyvista>=0.49.0",
    "torch>=2.13.0",
]
